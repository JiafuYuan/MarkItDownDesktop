name: Release MarkItDown engine

on:
  workflow_dispatch:
    inputs:
      version:
        description: Engine version, for example 0.1.8
        required: true
      markitdown_ref:
        description: Microsoft MarkItDown tag or commit (main is allowed)
        required: true
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build engine
        shell: pwsh
        run: .\build_engine.ps1 -SourceRef '${{ inputs.markitdown_ref }}' -Version '${{ inputs.version }}' -OutputDirectory artifacts
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'engine-v${{ inputs.version }}'
          gh release create $tag artifacts\markitdown.exe artifacts\engine-update.json artifacts\engine.version --title "MarkItDown engine ${{ inputs.version }}" --generate-notes --latest
