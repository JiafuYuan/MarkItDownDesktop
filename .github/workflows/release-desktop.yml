name: Release MarkItDown desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version, for example 1.0.0
        required: true
      engine_version:
        description: Engine version to bundle, for example 0.1.8
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download conversion engine
        shell: pwsh
        run: |
          $base = 'https://github.com/${{ github.repository }}/releases/download/engine-v${{ inputs.engine_version }}'
          New-Item -ItemType Directory -Force outputs | Out-Null
          Invoke-WebRequest "$base/markitdown.exe" -OutFile outputs\markitdown.exe
          Invoke-WebRequest "$base/engine-update.json" -OutFile outputs\engine-update.json
          $manifest = Get-Content -LiteralPath outputs\engine-update.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne '${{ inputs.engine_version }}') { throw "Engine release reports version $($manifest.version)." }
          $hash = (Get-FileHash -LiteralPath outputs\markitdown.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $manifest.sha256) { throw "Engine hash mismatch: $hash" }
      - name: Build desktop application
        shell: pwsh
        run: .\build_desktop.ps1 -EngineVersion '${{ inputs.engine_version }}'
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $zip = 'artifacts\MarkItDownDesktop-${{ inputs.version }}-win-x64.zip'
          Compress-Archive -Path outputs\MarkItDownDesktop -DestinationPath $zip
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'desktop-v${{ inputs.version }}'
          gh release create $tag artifacts\MarkItDownDesktop-${{ inputs.version }}-win-x64.zip --title "MarkItDown desktop ${{ inputs.version }}" --generate-notes --latest=false
